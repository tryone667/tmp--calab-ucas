<text x="25" y="500" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400">· ID 是纯组合级：它译码的就是 IF 本拍持有的指令，故两行同步；前递后的操作数让 beq 在 C4 的 ID 拍即可比较出 br_taken。</text>
<text x="25" y="520" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400">· 同一拍内：if_req 中在途的“错指1”被 !br_taken 清为无效，preIF 在 C4 已发出的“错指2”请求返回后被丢弃，两条错指都不会写回寄存器堆。</text>
<text x="25" y="540" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400">· 代价：C5、C6 两个周期没有有效指令交给 EX（2 个气泡），分支目标指令到 C7 才进 IF。若把分支推迟到 EX 再判，要冲刷的级数更多、代价更大。</text>
