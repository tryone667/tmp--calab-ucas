<text x="25" y="545" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400">· 读法：地址在 Ck 发出，数据在 Ck+1 返回；if_req_pc 把“已发出请求的 PC”暂存一拍，返回时正好与 rdata 配对。</text>
<text x="25" y="565" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400">· C5 发生 load-use 停顿：id_stall=1 → pre_if_allowin=0 → inst_sram_en=0。此时地址与数据一起冻结，RAM 不会多读一条，配对关系不被破坏。</text>
<text x="25" y="585" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400">· C6 恢复：C5 被跳过的请求在 C6 原样发出，C3 请求的指令仍在 rdata 上，IF 在 C6 用 if_req_pc 与 rdata 完成配对后送 ID。</text>
</svg>